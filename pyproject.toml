[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "tabulate-rust"
version = "0.1.0"
description = "Rust port of astanin/python-tabulate (drop-in mirror, same import name)"
authors = [{ name = "tabulate-rust contributors" }]
maintainers = [{ name = "tabulate-rust publishers" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
keywords = ["tabulate", "table", "rust"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/John-Cusack/tabulate-rust"
Upstream = "https://github.com/astanin/python-tabulate"

[project.scripts]
tabulate = "tabulate:_main"

[tool.maturin]
module-name = "tabulate._core"
bindings = "pyo3"
features = ["pyo3/extension-module"]
sdist-include = ["tabulate-core/**/*", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests", "tabulate"]
addopts = "--doctest-modules"
